version: '3.8'

services:
  dev:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    working_dir: /workspace
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: kryptonian
      POSTGRES_USER: kryptonian
      POSTGRES_PASSWORD: kryptonian
    ports:
      - "5432:5432"
    volumes:
      - kryptonian_postgres:/var/lib/postgresql/data

volumes:
  kryptonian_postgres:
