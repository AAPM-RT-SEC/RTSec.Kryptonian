services:
  orthanc:
    image: orthancteam/orthanc:latest
    restart: unless-stopped
    ports:
      - "8042:8042"
    expose:
      - "4242"
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./orthanc-tls:/etc/orthanc/tls:ro
      - orthanc-data:/var/lib/orthanc/db
    environment:
      ORTHANC__DICOM_WEB__ENABLE: "true"

  dimse-proxy:
    image: kryptonianregistry.azurecr.io/dimse-tls-proxy:latest
    restart: unless-stopped
    ports:
      - "4243:4243"
      - "8044:8044"
    volumes:
      - proxy-certs:/certs
    environment:
      CA_HARNESS_URL: "https://ca-harness.mangotree-b3d09362.eastus.azurecontainerapps.io"
      CA_HARNESS_API_KEY: "${CA_HARNESS_API_KEY}"
      ORTHANC_HOST: "orthanc"
      ORTHANC_PORT: "4242"
      LISTEN_PORT: "4243"
    depends_on:
      - orthanc

volumes:
  orthanc-data:
  proxy-certs:
