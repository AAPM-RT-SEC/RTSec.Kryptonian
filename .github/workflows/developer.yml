name: Developer checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/RTSec.Kryptonian.Ui/package-lock.json
      - name: Build administrator UI
        working-directory: src/RTSec.Kryptonian.Ui
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Build and test solution
        run: dotnet test RTSec.Kryptonian.sln --configuration Release --logger "trx;LogFilePrefix=tests" --results-directory TestResults
      - name: Build standalone DIMSE proxy
        run: dotnet build src/RTSec.Kryptonian.DimseTlsProxy --configuration Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx
