
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kryptonian-db
    environment:
      POSTGRES_USER: kryptonian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kryptonian_dev_password}
      POSTGRES_DB: kryptonian
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kryptonian -d kryptonian"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kryptonian-network

  # Kryptonian API
  api:
    build:
      context: .
      dockerfile: src/RTSec.Kryptonian.Api/Dockerfile
    container_name: kryptonian-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=kryptonian;Username=kryptonian;Password=${POSTGRES_PASSWORD:-kryptonian_dev_password}"

      # ASP.NET Core
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5000

      # Admin API keys (comma-separated)
      Kryptonian__AdminApi__ApiKeys: ${ADMIN_API_KEYS:-dev-api-key-change-in-production}

      # Self-signed CA configuration (optional, paths inside container)
      KRYPTONIAN__CA__SELFSIGNED__PFXPATH: /app/certs/ca.pfx
      KRYPTONIAN__CA__SELFSIGNED__PFXPASSWORD: ${CA_PFX_PASSWORD:-}

      # Logging
      Serilog__MinimumLevel__Default: Information
      Serilog__MinimumLevel__Override__Microsoft: Warning
    volumes:
      # Mount certificates directory
      - ./certs:/app/certs:ro
      # Mount logs directory
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - kryptonian-network

  # Kryptonian Admin Web UI (optional)
  web:
    build:
      context: .
      dockerfile: src/RTSec.Kryptonian.Web/Dockerfile
    container_name: kryptonian-web
    depends_on:
      api:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:5001
      ApiBaseUrl: http://api:5000
      ApiKey: ${ADMIN_API_KEYS:-dev-api-key-change-in-production}
    ports:
      - "5001:5001"
    networks:
      - kryptonian-network
    profiles:
      - web  # Only start with: docker compose --profile web up

volumes:
  postgres_data:
    driver: local

networks:
  kryptonian-network:
    driver: bridge
